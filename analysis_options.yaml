# Static analysis for Khetha Go.
#
# Beyond the standard Flutter lints, this turns on strict type checking. The
# app hit a runtime crash during development because a `dynamic` field hid a
# missing extension method from the analyzer. `strict-casts`, `strict-raw-types`
# and `avoid_dynamic_calls` turn that class of mistake into an analysis failure
# instead of a red screen in front of a judge.
#
# `strict-inference` is deliberately left off: it flags every un-parameterised
# CupertinoPageRoute, which is noise rather than signal.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # An unused import or a dead variable is a defect, not a suggestion.
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - ios/**
    - android/**
    - macos/**
    - linux/**
    - windows/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
