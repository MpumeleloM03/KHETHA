publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.0
  image_picker: ^1.0.0
  file_picker: ^8.0.0
